<section [@pageEnter] class="mx-auto flex w-full min-w-0 max-w-md flex-col gap-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Login</h1>
    <p class="mt-1 text-sm text-muted">Entre com seu usuário e senha para manter eventos e palestrantes.</p>
  </div>

  @if (error) {
    <p
      [@alertMotion]
      class="rounded-[length:var(--radius-control)] border border-danger-border bg-danger-soft px-4 py-3 text-sm text-danger"
    >
      {{ error }}
    </p>
  }

  <form
    [@panelEnter]
    class="flex flex-col gap-4 rounded-[length:var(--radius-control)] border border-line bg-panel p-6"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">Usuário</span>
      <input
        type="text"
        formControlName="userName"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        placeholder="seu.usuario"
        autocomplete="username"
      />
      @if (form.get('userName')?.invalid && form.get('userName')?.touched) {
        <span class="text-xs text-danger">Usuário é obrigatório.</span>
      }
    </label>
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">Senha</span>
      <input
        type="password"
        formControlName="password"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        placeholder="••••••••"
        autocomplete="current-password"
      />
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <span class="text-xs text-danger">Senha é obrigatória.</span>
      }
    </label>
    <button
      type="submit"
      class="motion-press inline-flex w-full items-center justify-center gap-2 rounded-[length:var(--radius-control)] bg-accent px-4 py-2 text-sm font-medium text-white hover:bg-accent-dark active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="saving"
    >
      <app-loading-spinner [active]="saving" variant="button" />
      {{ saving ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="text-center text-sm text-muted">
    Não tem conta?
    <a routerLink="/register" class="font-medium text-accent-dark hover:underline">Cadastre-se</a>
  </p>
</section>
