<section class="mx-auto flex max-w-md flex-col gap-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Alterar senha</h1>
    <p class="mt-1 text-sm text-muted">Informe a senha atual e escolha uma nova senha.</p>
  </div>

  <form
    class="flex flex-col gap-4 rounded-[length:var(--radius-control)] border border-line bg-panel p-6"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">Senha atual</span>
      <input
        type="password"
        formControlName="currentPassword"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        autocomplete="current-password"
      />
    </label>
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">Nova senha</span>
      <input
        type="password"
        formControlName="newPassword"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        autocomplete="new-password"
      />
    </label>
    @if (error) {
      <p
        class="rounded-[length:var(--radius-control)] border border-danger-border bg-danger-soft px-4 py-3 text-sm text-danger"
      >
        {{ error }}
      </p>
    }
    @if (success) {
      <p
        class="rounded-[length:var(--radius-control)] border border-line bg-surface px-4 py-3 text-sm text-accent-dark"
      >
        {{ success }}
      </p>
    }
    <button
      type="submit"
      class="inline-flex w-full items-center justify-center rounded-[length:var(--radius-control)] bg-accent px-4 py-2 text-sm font-medium text-white hover:bg-accent-dark active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="saving"
    >
      {{ saving ? 'Salvando...' : 'Alterar senha' }}
    </button>
  </form>

  <p class="text-center text-sm text-muted">
    <a routerLink="/perfil" class="font-medium text-accent-dark hover:underline">Voltar ao perfil</a>
  </p>
</section>
