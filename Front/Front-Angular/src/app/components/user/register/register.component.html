<section class="mx-auto flex max-w-md flex-col gap-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">Cadastro</h1>
    <p class="mt-1 text-sm text-muted">Crie sua conta para gerenciar eventos e palestrantes.</p>
  </div>

  <form
    class="flex flex-col gap-4 rounded-[length:var(--radius-control)] border border-line bg-panel p-6"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">Nome</span>
      <input
        type="text"
        formControlName="nome"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        placeholder="Seu nome"
      />
      @if (form.get('nome')?.invalid && form.get('nome')?.touched) {
        <span class="text-xs text-danger">Nome é obrigatório.</span>
      }
    </label>
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">Usuário</span>
      <input
        type="text"
        formControlName="userName"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        placeholder="seu.usuario"
        autocomplete="username"
      />
      @if (form.get('userName')?.invalid && form.get('userName')?.touched) {
        <span class="text-xs text-danger">Usuário é obrigatório.</span>
      }
    </label>
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">E-mail</span>
      <input
        type="email"
        formControlName="email"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        placeholder="usuario@exemplo.com"
        autocomplete="email"
      />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <span class="text-xs text-danger">E-mail válido é obrigatório.</span>
      }
    </label>
    <label class="flex flex-col gap-2 text-sm">
      <span class="font-medium">Senha</span>
      <input
        type="password"
        formControlName="password"
        class="w-full rounded-[length:var(--radius-control)] border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-accent/20"
        placeholder="••••••••"
        autocomplete="new-password"
      />
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <span class="text-xs text-danger">Senha é obrigatória.</span>
      }
    </label>
    @if (error) {
      <p
        class="rounded-[length:var(--radius-control)] border border-danger-border bg-danger-soft px-4 py-3 text-sm text-danger"
      >
        {{ error }}
      </p>
    }
    <button
      type="submit"
      class="inline-flex w-full items-center justify-center rounded-[length:var(--radius-control)] bg-accent px-4 py-2 text-sm font-medium text-white hover:bg-accent-dark active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="saving"
    >
      {{ saving ? 'Cadastrando...' : 'Cadastrar' }}
    </button>
  </form>

  <p class="text-center text-sm text-muted">
    Já tem conta?
    <a routerLink="/login" class="font-medium text-accent-dark hover:underline">Entrar</a>
  </p>
</section>
