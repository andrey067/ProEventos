# Harness Code pipeline: e2e
# Bound in UI to this path (.harness/e2e.yaml). Keep pipelines/e2e.yaml identical.
# Native Open Source schema only — do not replace with hello-world or Enterprise YAML.
# Mirrors .github/workflows/e2e.yaml (Playwright Vue + API on :5173 / :5050).
version: 1
kind: pipeline
spec:
  stages:
    - name: playwright_vue
      type: ci
      spec:
        # depth only — clone host comes from GITNESS_URL_CONTAINER (infra), not YAML.
        # See docs/harness-ci.md (Could not resolve host: harness.homelab.local).
        clone:
          depth: 50
        steps:
          - name: run_e2e
            type: run
            timeout: 30m
            spec:
              container: mcr.microsoft.com/playwright:v1.49.1-jammy
              shell: bash
              script: |-
                set -eu
                curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
                export DOTNET_ROOT="$HOME/.dotnet"
                export PATH="$DOTNET_ROOT:$PATH"

                corepack enable
                corepack prepare pnpm@9 --activate

                cd e2e && pnpm install
                cd ../Front/Front-Vue && pnpm install --frozen-lockfile
                cd ../../e2e && pnpm exec playwright install chromium

                cd ../Back/src/ProEventos.Api
                if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
                dotnet run --urls http://127.0.0.1:5050 &
                API_PID=$!
                API_OK=0
                for i in $(seq 1 60); do
                  if curl -sf http://127.0.0.1:5050/openapi/v1.json; then API_OK=1; break; fi
                  sleep 2
                done
                test "$API_OK" = 1 || { kill $API_PID 2>/dev/null || true; echo "API failed to become ready on :5050" >&2; exit 1; }

                cd ../../../Front/Front-Vue
                pnpm dev --host 127.0.0.1 --port 5173 &
                VUE_PID=$!
                VUE_OK=0
                for i in $(seq 1 60); do
                  if curl -sf http://127.0.0.1:5173; then VUE_OK=1; break; fi
                  sleep 2
                done
                test "$VUE_OK" = 1 || { kill $VUE_PID $API_PID 2>/dev/null || true; echo "Vue failed to become ready on :5173" >&2; exit 1; }

                cd ../../e2e
                export CI=true
                export BASE_URL=http://127.0.0.1:5173
                export API_URL=http://127.0.0.1:5050
                set +e
                pnpm exec playwright test --project=vue
                STATUS=$?
                set -e
                kill $VUE_PID $API_PID 2>/dev/null || true
                exit $STATUS
