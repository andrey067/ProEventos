# Harness Code pipeline: e2e (identifier in UI: e2e)
# YAML path bound in UI: .harness/e2e.yaml (keep pipelines/e2e.yaml identical).
# Trigger: only "main" (Branch Updated + Pull Request Merged) — not on PR checks.
# Guard below also skips PR / non-main if this pipeline is mis-triggered.
# Playwright: Vue (:5173) + React (:3000) + Angular (:4200) against API (:5050).
version: 1
kind: pipeline
spec:
  stages:
    - name: playwright_all_fronts
      type: ci
      spec:
        clone:
          depth: 50
        steps:
          - name: e2e_all_fronts
            type: run
            timeout: 45m
            spec:
              container: mcr.microsoft.com/playwright:v1.49.1-jammy
              shell: bash
              script: |-
                set -eu

                # --- Guard: E2E only on main (not PR checks) ---
                # PR clones often check out main then merge the PR head, so branch
                # name alone is unreliable — prefer event / PR id env vars.
                event="${DRONE_BUILD_EVENT:-${CI_EVENT:-${CI_PIPELINE_SOURCE:-}}}"
                pr="${DRONE_PULL_REQUEST:-${CI_PULL_REQUEST:-${DRONE_PULL_REQUEST_IID:-}}}"
                branch="${DRONE_BRANCH:-${DRONE_COMMIT_BRANCH:-${DRONE_TARGET_BRANCH:-${CI_COMMIT_BRANCH:-}}}}"
                echo "E2E guard: event=${event:-?} pr=${pr:-?} branch=${branch:-?}"

                case "$event" in
                  pull_request|pull-request|pullrequest|pr)
                    echo "Skip E2E: pull_request event"
                    exit 0
                    ;;
                esac

                if [ -n "$pr" ] && [ "$pr" != "0" ] && [ "$pr" != "false" ]; then
                  echo "Skip E2E: pull request id=$pr"
                  exit 0
                fi

                case "$branch" in
                  ""|main|refs/heads/main)
                    ;;
                  *)
                    echo "Skip E2E: branch=$branch (only main)"
                    exit 0
                    ;;
                esac
                # --- end guard ---

                curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
                export DOTNET_ROOT="$HOME/.dotnet"
                export PATH="$DOTNET_ROOT:$PATH"

                # Avoid corepack prepare — old corepack in images fails pnpm keyid verify.
                npm install -g pnpm@9

                cd e2e && pnpm install
                cd ../Front/Front-Vue && pnpm install --frozen-lockfile
                cd ../Front-React && pnpm install --frozen-lockfile
                cd ../Front-Angular && pnpm install --frozen-lockfile
                cd ../../e2e && pnpm exec playwright install chromium

                wait_http() {
                  url="$1"
                  label="$2"
                  ok=0
                  i=1
                  while [ "$i" -le 90 ]; do
                    if curl -sf "$url" >/dev/null; then ok=1; break; fi
                    sleep 2
                    i=$((i + 1))
                  done
                  test "$ok" = 1 || { echo "$label failed to become ready at $url" >&2; return 1; }
                }

                cd ../Back/src/ProEventos.Api
                if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
                dotnet run --urls http://127.0.0.1:5050 &
                API_PID=$!
                wait_http http://127.0.0.1:5050/openapi/v1.json API || {
                  kill $API_PID 2>/dev/null || true
                  exit 1
                }

                cd ../../../Front/Front-Vue
                pnpm dev --host 127.0.0.1 --port 5173 &
                VUE_PID=$!

                cd ../Front-React
                pnpm dev --host 127.0.0.1 --port 3000 &
                REACT_PID=$!

                cd ../Front-Angular
                pnpm exec ng serve --host 127.0.0.1 --port 4200 &
                ANGULAR_PID=$!

                cleanup() {
                  kill $VUE_PID $REACT_PID $ANGULAR_PID $API_PID 2>/dev/null || true
                }

                wait_http http://127.0.0.1:5173 Vue || { cleanup; exit 1; }
                wait_http http://127.0.0.1:3000 React || { cleanup; exit 1; }
                wait_http http://127.0.0.1:4200 Angular || { cleanup; exit 1; }

                cd ../../e2e
                export CI=true
                export API_URL=http://127.0.0.1:5050
                set +e
                pnpm exec playwright test --project=vue --project=react --project=angular
                STATUS=$?
                set -e
                cleanup
                exit $STATUS
