# Harness Code CI — mirrors .github/workflows/ci.yaml
# Native Harness Open Source / Harness Code schema (version/kind).
# Do NOT use Enterprise CI YAML here (pipeline:/PLACEHOLDER_*/account.harnessImage);
# that format fails to parse and the check errors in 0s.
version: 1
kind: pipeline
spec:
  stages:
    - name: quality_gate
      type: ci
      spec:
        # depth only — clone host comes from GITNESS_URL_CONTAINER (infra), not YAML.
        # See docs/harness-ci.md (Could not resolve host: harness.homelab.local).
        clone:
          depth: 50
        steps:
          - name: backend_tests
            type: run
            spec:
              container: mcr.microsoft.com/dotnet/sdk:10.0
              shell: sh
              script: |-
                set -euo pipefail
                dotnet test Back/src/ProEventos.sln --configuration Release

          - name: front_vue
            type: run
            spec:
              container: node:22-bookworm
              shell: sh
              script: |-
                set -euo pipefail
                corepack enable
                corepack prepare pnpm@9 --activate
                cd Front/Front-Vue
                pnpm install --frozen-lockfile
                pnpm test:coverage

          - name: front_react
            type: run
            spec:
              container: node:22-bookworm
              shell: sh
              script: |-
                set -euo pipefail
                corepack enable
                corepack prepare pnpm@9 --activate
                cd Front/Front-React
                pnpm install --frozen-lockfile
                pnpm test:coverage

          - name: front_angular
            type: run
            spec:
              container: node:22-bookworm
              shell: sh
              script: |-
                set -euo pipefail
                corepack enable
                corepack prepare pnpm@9 --activate
                cd Front/Front-Angular
                pnpm install --frozen-lockfile
                pnpm test:coverage

          - name: compare_baselines
            type: run
            spec:
              container: node:22-bookworm
              shell: sh
              script: |-
                set -euo pipefail
                SVC=$(find Back/tests -path '*Services.Tests*' -name coverage.cobertura.xml | head -1)
                PERS=$(find Back/tests -path '*Persistence.Tests*' -name coverage.cobertura.xml | head -1)
                API=$(find Back/tests -path '*Api.Tests*' -name coverage.cobertura.xml | head -1)
                test -n "$SVC" && test -n "$PERS" && test -n "$API"
                node quality/compare-coverage.mjs \
                  --baselines quality/coverage-baselines.json \
                  --services "$SVC" \
                  --persistence "$PERS" \
                  --api "$API" \
                  --front-vue Front/Front-Vue/coverage/coverage-summary.json \
                  --front-react Front/Front-React/coverage/coverage-summary.json \
                  --front-angular Front/Front-Angular/coverage/coverage-summary.json
