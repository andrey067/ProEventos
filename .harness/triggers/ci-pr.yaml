# Reference only — Harness Code configures triggers in the UI (see .harness/README.md).
# Enterprise import stub: PR → main → pipeline ci (quality + e2e_all_fronts).
trigger:
  name: pr
  identifier: proeventos_ci_pr
  enabled: true
  description: "UI: PR Created + Updated + Reopened; target main"
  orgIdentifier: PLACEHOLDER_ORG
  projectIdentifier: PLACEHOLDER_PROJECT
  pipelineIdentifier: ci
  stagesToExecute: []
  source:
    type: Webhook
    spec:
      type: Harness
      spec:
        type: PullRequest
        spec:
          connectorRef: ""
          autoAbortPreviousExecutions: true
          repoName: Homelab/ProEventos
          actions:
            - Open
            - Reopen
            - Edit
            - Sync
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          headerConditions: []
  inputYaml: |
    pipeline:
      identifier: ci
      properties:
        ci:
          codebase:
            build:
              type: PR
              spec:
                number: <+trigger.prNumber>
