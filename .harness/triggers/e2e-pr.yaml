# Trigger: run ProEventos E2E on Harness Code PRs targeting main.
trigger:
  name: E2E on PR
  identifier: proeventos_e2e_pr
  enabled: true
  description: Mirrors GitHub Actions e2e.yml on pull_request
  orgIdentifier: PLACEHOLDER_ORG
  projectIdentifier: PLACEHOLDER_PROJECT
  pipelineIdentifier: proeventos_e2e
  stagesToExecute: []
  source:
    type: Webhook
    spec:
      type: Harness
      spec:
        type: PullRequest
        spec:
          connectorRef: ""
          autoAbortPreviousExecutions: true
          repoName: Homelab/ProEventos
          actions:
            - Open
            - Reopen
            - Edit
            - Sync
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          headerConditions: []
  inputYaml: |
    pipeline:
      identifier: proeventos_e2e
      properties:
        ci:
          codebase:
            build:
              type: PR
              spec:
                number: <+trigger.prNumber>
