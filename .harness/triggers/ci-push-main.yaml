# Reference only — configure triggers in the UI (see .harness/README.md).
# Enterprise stub: push/merge to main → pipeline e2e.
trigger:
  name: main
  identifier: proeventos_e2e_main
  enabled: true
  description: "UI on pipeline e2e: Branch Updated (main) + Pull Request Merged"
  orgIdentifier: PLACEHOLDER_ORG
  projectIdentifier: PLACEHOLDER_PROJECT
  pipelineIdentifier: e2e
  stagesToExecute: []
  source:
    type: Webhook
    spec:
      type: Harness
      spec:
        type: Push
        spec:
          connectorRef: ""
          autoAbortPreviousExecutions: true
          repoName: Homelab/ProEventos
          actions: []
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          headerConditions: []
  inputYaml: |
    pipeline:
      identifier: e2e
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branchName: <+trigger.branch>
