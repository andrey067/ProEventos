# Reference only — Harness Code configures triggers in the UI (see .harness/README.md).
# Enterprise import stub: push/merge to main → pipeline ci.
trigger:
  name: main
  identifier: proeventos_ci_main
  enabled: true
  description: "UI: Branch Updated (main only) and/or Pull Request Merged"
  orgIdentifier: PLACEHOLDER_ORG
  projectIdentifier: PLACEHOLDER_PROJECT
  pipelineIdentifier: ci
  stagesToExecute: []
  source:
    type: Webhook
    spec:
      type: Harness
      spec:
        type: Push
        spec:
          connectorRef: ""
          autoAbortPreviousExecutions: true
          repoName: Homelab/ProEventos
          actions: []
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: main
          headerConditions: []
  inputYaml: |
    pipeline:
      identifier: ci
      properties:
        ci:
          codebase:
            build:
              type: branch
              spec:
                branchName: <+trigger.branch>
