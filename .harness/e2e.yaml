# Harness E2E — mirrors .github/workflows/e2e.yaml (Vue + API smoke)
pipeline:
  name: ProEventos E2E
  identifier: proeventos_e2e
  projectIdentifier: PLACEHOLDER_PROJECT
  orgIdentifier: PLACEHOLDER_ORG
  tags:
    repo: ProEventos
    kind: e2e
  properties:
    ci:
      codebase:
        connectorRef: PLACEHOLDER_CODE_CONNECTOR
        repoName: Homelab/ProEventos
        build: <+input>
  stages:
    - stage:
        name: Playwright Vue
        identifier: playwright_vue
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install and run E2E
                  identifier: run_e2e
                  timeout: 30m
                  spec:
                    connectorRef: account.harnessImage
                    image: mcr.microsoft.com/playwright:v1.49.1-jammy
                    shell: Sh
                    command: |-
                      set -euo pipefail
                      curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
                      bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
                      export DOTNET_ROOT="$HOME/.dotnet"
                      export PATH="$DOTNET_ROOT:$PATH"

                      corepack enable
                      corepack prepare pnpm@9 --activate

                      cd e2e && pnpm install
                      cd ../Front/Front-Vue && pnpm install --frozen-lockfile
                      cd ../../e2e && pnpm exec playwright install chromium

                      cd ../Back/src/ProEventos.Api
                      if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
                      dotnet run --urls http://127.0.0.1:5050 &
                      API_PID=$!
                      for i in $(seq 1 60); do
                        curl -sf http://127.0.0.1:5050/openapi/v1.json && break
                        sleep 2
                      done

                      cd ../../../Front/Front-Vue
                      pnpm dev --host 127.0.0.1 --port 5173 &
                      VUE_PID=$!
                      for i in $(seq 1 60); do
                        curl -sf http://127.0.0.1:5173 && break
                        sleep 2
                      done

                      cd ../../e2e
                      export CI=true
                      export BASE_URL=http://127.0.0.1:5173
                      export API_URL=http://127.0.0.1:5050
                      pnpm exec playwright test --project=vue
                      STATUS=$?
                      kill $VUE_PID $API_PID 2>/dev/null || true
                      exit $STATUS
